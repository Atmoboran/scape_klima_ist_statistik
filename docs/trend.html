<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-t="trend.pageTitle">Klimatrend</title>
<meta name="description" content="">
<!-- Structure only. Design: theme/ · texts: content/texts.de.js · layout: css/ · behaviour: js/ -->
<script src="js/view.js" data-app="klimastatistik"></script>
<link rel="stylesheet" href="theme/theme.css">
<link rel="stylesheet" href="css/kit.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="top">
  <a class="logo" href="index.html" data-brand="logo"></a>
  <div class="top-right">
    <nav class="nav" data-t-aria="nav.ariaLabel">
      <a href="index.html"><span class="num">1</span><span data-t="nav.daily"></span></a>
      <a href="trend.html" aria-current="page"><span class="num">2</span><span data-t="nav.trend"></span></a>
    </nav>
    <button type="button" class="view-toggle"></button>
  </div>
</header>

<div class="poster small">
  <div class="f f1"></div><div class="f f2"></div><div class="f f3"></div>
  <svg class="l2" viewBox="0 0 120 120" aria-hidden="true">
    <path d="M4,114 C30,114 38,20 60,20 C82,20 90,114 116,114 Z" fill="currentColor"/>
  </svg>
  <svg class="l3" viewBox="0 0 400 400" aria-hidden="true">
    <path d="M0,330 C90,330 110,110 170,110 C230,110 250,330 340,330"/>
    <path d="M60,330 C150,330 170,90 230,90 C290,90 310,330 400,330"/>
  </svg>
  <div class="poster-text">
    <p class="kicker" data-t="trend.kicker"></p>
    <h1 class="headline" data-t-html="trend.headline"></h1>
    <p class="lead" data-t="trend.lead"></p>
  </div>
</div>

<main class="page">
  <div class="lab">
    <div class="lab-pre">
      <div class="pickers">
        <div class="pick">
          <div class="pick-head">
            <label for="trend-variable-select" class="section-label" data-t="pickers.variable"></label>
            <button type="button" class="info" aria-controls="variable-note" data-t-aria="pickers.variableInfoAria"></button>
          </div>
          <select id="trend-variable-select" class="select">
            <option value="temperature" data-t="variables.temperature.label"></option>
            <option value="precipitation" data-t="variables.precipitation.label"></option>
            <option value="sunshine" data-t="variables.sunshine.label"></option>
          </select>
        </div>
        <div class="pick">
          <div class="pick-head">
            <label for="trend-station-select" class="section-label" data-t="pickers.station"></label>
            <button type="button" class="info" aria-controls="station-note" data-t-aria="pickers.stationInfoAria"></button>
          </div>
          <select id="trend-station-select" class="select"></select>
        </div>
        <div class="pick">
          <div class="pick-head">
            <label for="trend-period-select" class="section-label" data-t="common.referencePeriodShort"></label>
            <button type="button" class="info" aria-controls="period-note" data-t-aria="common.periodInfoAria"></button>
          </div>
          <select id="trend-period-select" class="select"></select>
        </div>
      </div>
      <div class="info-note" id="variable-note" hidden></div>
      <div class="info-note" id="station-note" hidden></div>
      <div class="info-note" id="period-note" hidden data-t-html="common.periodInfo"></div>

      <div class="seg-row">
        <div class="seg" id="trend-mode-toggle" role="group" data-t-aria="trend.viewLabel"></div>
      </div>
      <div class="seg-row" id="dist-season-group">
        <div class="seg" id="dist-season-toggle" role="group" data-t-aria="trend.seasonLabel"></div>
      </div>
    </div>

    <div class="lab-stage">
      <div class="stage-frame chart-frame" id="stage-frame">
        <div class="chart-pane" id="trend-annual-wrap">
          <svg id="trend-chart" class="chart" role="img"></svg>
        </div>
        <div class="chart-pane" id="trend-distribution-wrap" hidden>
          <div class="distribution-year-badge">
            <div class="badge-top">
              <span class="num" id="distribution-year">–</span>
              <span class="sub" id="distribution-station-label"></span>
            </div>
            <span class="dev" id="distribution-dev"></span>
          </div>
          <svg id="distribution-chart" class="chart" role="img"></svg>
        </div>
        <div id="trend-tooltip" class="tooltip" hidden></div>
        <p class="load-error" id="load-error" hidden data-t="loadError"></p>
      </div>
      <div class="timeline" id="dist-timeline-wrap" hidden>
        <span class="transport">
          <button type="button" class="tool" id="dist-prev-btn" data-t-aria="timeline.prevAria"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h2.6v14H5zM19 5l-10 7 10 7z"/></svg></button>
          <button type="button" class="tool play pulse" id="dist-play-btn" data-t-aria="timeline.playAria">
            <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8V4z"/></svg>
            <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12"/></svg>
          </button>
          <button type="button" class="tool" id="dist-next-btn" data-t-aria="timeline.nextAria"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.4 5H19v14h-2.6zM5 5l10 7-10 7z"/></svg></button>
        </span>
        <span class="year-bound" id="dist-year-start">–</span>
        <input type="range" id="dist-year-slider" class="year-slider" min="0" max="0" value="0" step="1" data-t-aria="timeline.sliderAria">
        <span class="year-bound" id="dist-year-end">–</span>
      </div>
    </div>

    <div class="lab-post">
      <button type="button" class="btn tasks-open" id="tasks-open" aria-haspopup="dialog" aria-controls="tasks-dialog">
        <span data-t="quiz.open"></span> <span class="quiz-progress" id="quiz-progress"></span>
      </button>
    </div>
  </div>

  <dialog class="quiz-dialog" id="tasks-dialog" aria-labelledby="tasks-title">
    <div class="quiz-head">
      <h2 id="tasks-title" data-t="quiz.title"></h2>
      <button type="button" class="quiz-close" id="tasks-close" data-t-aria="quiz.closeAria">&times;</button>
    </div>
    <p class="quiz-intro" data-t="quiz.intro"></p>
    <ol class="quiz" id="quiz"></ol>
  </dialog>

  <div class="topics">
    <details class="topic"><summary data-t="common.topics.chartTitle"></summary><div class="topic-body" id="topic-chart"></div></details>
    <details class="topic"><summary data-t="common.topics.calcTitle"></summary><div class="topic-body" id="topic-calc"></div></details>
    <details class="topic"><summary data-t="common.topics.climateTitle"></summary><div class="topic-body" id="topic-climate"></div></details>
  </div>

  <div class="next-part back"><a class="btn" href="index.html" data-t="trend.back"></a></div>
</main>

<footer class="foot">
  <p class="sources" data-t="sources"></p>
  <p class="brand-line" data-brand="line"></p>
</footer>

<script src="theme/theme.js"></script>
<script src="content/texts.de.js"></script>
<script src="js/texts.js"></script>
<script src="js/brand.js"></script>
<script src="js/kit.js"></script>
<script src="js/vendor/d3.v7.min.js"></script>
<script src="js/shared.js"></script>
<script src="js/variable-config.js"></script>
<script src="js/annual-trend-plot.js"></script>
<script src="js/distribution-plot.js"></script>
<script src="js/trend.js"></script>
</body>
</html>
