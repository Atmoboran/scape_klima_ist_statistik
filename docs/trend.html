<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title data-t="trend.pageTitle"></title>
<link rel="stylesheet" href="theme/theme.css" />
<link rel="stylesheet" href="css/style.css" />
<script>
  (function () {
    var mode;
    try {
      var stored = localStorage.getItem("scapeViewMode");
      mode = (stored === "mobile" || stored === "desktop") ? stored : null;
    } catch (e) {}
    if (!mode) {
      mode = window.matchMedia("(max-width: 699px)").matches ? "mobile" : "desktop";
    }
    document.documentElement.setAttribute("data-view", mode);
  })();
</script>
</head>
<body>

<div class="brand-bar">
  <div class="brand-identity">
    <div class="brand-quad" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
      <svg class="brand-arc" viewBox="0 0 100 100"><path d="M 15 85 A 35 35 0 0 1 85 85" /></svg>
    </div>
    <div class="brand-word">
      <span class="brand-logo" data-t-html="brand.nameHtml"></span>
      <span class="brand-sub" data-t="brand.claim"></span>
    </div>
  </div>
  <button id="view-toggle" class="view-toggle" type="button"></button>
</div>

<nav class="page-nav" data-t-aria="nav.ariaLabel">
  <a href="index.html" class="page-nav-link" data-t="nav.daily"></a>
  <a href="trend.html" class="page-nav-link active" aria-current="page" data-t="nav.trend"></a>
</nav>

<header class="app-header">
  <h1 data-t="trend.title"></h1>
  <p class="subtitle" data-t="trend.subtitle"></p>
</header>

<div class="picker-row">
  <div class="field-group">
    <label for="trend-variable-select" class="field-label" data-t="pickers.variable"></label>
    <select id="trend-variable-select" class="station-select">
      <option value="temperature" data-t="variables.temperature.label"></option>
      <option value="precipitation" data-t="variables.precipitation.label"></option>
      <option value="sunshine" data-t="variables.sunshine.label"></option>
    </select>
  </div>
  <div class="field-group">
    <label for="trend-station-select" class="field-label" data-t="pickers.station"></label>
    <select id="trend-station-select" class="station-select"></select>
  </div>
</div>

<main class="plot-shell">
  <div class="plot-toolbar">
    <div class="period-toggle-group">
      <span class="ref-period-label" data-t="trend.viewLabel"></span>
      <div class="period-toggle-row" id="trend-mode-toggle"></div>
    </div>
    <div class="period-toggle-group">
      <span class="ref-period-label" data-t="common.referencePeriodLabel"></span>
      <div class="period-toggle-row" id="trend-period-toggle"></div>
    </div>
    <div class="period-toggle-group" id="dist-season-group" style="display: none;">
      <span class="ref-period-label" data-t="trend.seasonLabel"></span>
      <div class="period-toggle-row season-toggle-row" id="dist-season-toggle"></div>
    </div>
  </div>

  <div class="chart-wrap" id="trend-annual-wrap">
    <svg id="trend-chart" role="img"></svg>
    <div id="trend-tooltip" class="tooltip" hidden></div>
  </div>
  <p class="compare-headline" id="trend-caption"></p>

  <div class="timeline-wrap" id="dist-timeline-wrap" style="display: none;">
    <div class="timeline-track-row">
      <span class="timeline-year-bound" id="dist-year-start">–</span>
      <input type="range" id="dist-year-slider" class="year-slider" min="0" max="0" value="0" step="1" data-t-aria="timeline.sliderAria" />
      <span class="timeline-year-bound" id="dist-year-end">–</span>
    </div>
    <div class="transport-controls">
      <button id="dist-prev-btn" class="step-btn" data-t-aria="timeline.prevAria">&#9664;</button>
      <button id="dist-play-btn" class="play-btn" data-t-aria="timeline.playAria">&#9654;</button>
      <button id="dist-next-btn" class="step-btn" data-t-aria="timeline.nextAria">&#9654;</button>
    </div>
  </div>

  <div class="chart-wrap" id="trend-distribution-wrap" style="display: none;">
    <div class="distribution-year-badge">
      <span class="num" id="distribution-year">–</span>
      <span class="sub" id="distribution-station-label"></span>
    </div>
    <svg id="distribution-chart" role="img"></svg>
  </div>
  <p class="compare-headline" id="dist-caption" style="display: none;"></p>
</main>

<footer class="app-footer">
  <p data-t="footer.data"></p>
  <p class="footer-scape" data-t="footer.credit"></p>
</footer>

<script src="theme/theme.js"></script>
<script src="content/texts.de.js"></script>
<script src="js/texts.js"></script>
<script src="js/vendor/d3.v7.min.js"></script>
<script src="js/variable-config.js"></script>
<script src="js/annual-trend-plot.js"></script>
<script src="js/distribution-plot.js"></script>
<script src="js/trend.js"></script>
</body>
</html>
