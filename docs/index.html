<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title data-t="daily.pageTitle"></title>
<link rel="stylesheet" href="theme/theme.css" />
<link rel="stylesheet" href="css/style.css" />
<script>
  (function () {
    var mode;
    try {
      var stored = localStorage.getItem("scapeViewMode");
      mode = (stored === "mobile" || stored === "desktop") ? stored : null;
    } catch (e) {}
    if (!mode) {
      mode = window.matchMedia("(max-width: 699px)").matches ? "mobile" : "desktop";
    }
    document.documentElement.setAttribute("data-view", mode);
  })();
</script>
</head>
<body>

<div class="brand-bar">
  <div class="brand-wordmark">
    <span class="brand-logo" data-t-html="brand.nameHtml"></span>
    <span class="brand-sub" data-t="brand.claim"></span>
  </div>
  <button id="view-toggle" class="view-toggle" type="button"></button>
</div>

<div class="color-band" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

<nav class="page-nav" data-t-aria="nav.ariaLabel">
  <a href="index.html" class="page-nav-link active" aria-current="page" data-t="nav.daily"></a>
  <a href="trend.html" class="page-nav-link" data-t="nav.trend"></a>
</nav>

<header class="app-header">
  <h1 data-t="daily.title"></h1>
  <p class="subtitle" data-t="daily.subtitle"></p>
</header>

<div class="picker-row">
  <div class="field-group">
    <label for="variable-select" class="field-label" data-t="pickers.variable"></label>
    <div class="field-with-info">
      <select id="variable-select" class="station-select">
        <option value="temperature" data-t="variables.temperature.label"></option>
        <option value="precipitation" data-t="variables.precipitation.label"></option>
        <option value="sunshine" data-t="variables.sunshine.label"></option>
      </select>
      <button
        id="variable-info-btn"
        class="info-btn"
        type="button"
        aria-haspopup="dialog"
        aria-expanded="false"
        aria-controls="info-popover"
        data-t-aria="pickers.variableInfoAria"
      >i</button>
    </div>
  </div>
  <div class="field-group">
    <label for="station-select" class="field-label" data-t="pickers.station"></label>
    <div class="field-with-info">
      <select id="station-select" class="station-select"></select>
      <button
        id="station-info-btn"
        class="info-btn"
        type="button"
        aria-haspopup="dialog"
        aria-expanded="false"
        aria-controls="info-popover"
        data-t-aria="pickers.stationInfoAria"
      >i</button>
    </div>
  </div>
</div>

<div class="info-popover-backdrop" id="info-popover-backdrop" hidden></div>
<div class="info-popover" id="info-popover" role="dialog" aria-modal="true" aria-labelledby="info-popover-title" hidden>
  <div class="info-popover-header">
    <span id="info-popover-title" class="info-popover-title"></span>
    <button type="button" class="info-popover-close" id="info-popover-close" data-t-aria="dialog.closeAria">&times;</button>
  </div>
  <div class="info-popover-body" id="info-popover-body"></div>
</div>

<main class="plot-shell">
  <div class="plot-toolbar">
    <div class="deviation-badge" id="deviation-badge">
      <span class="deviation-year" id="deviation-year">–</span>
      <div class="deviation-stats">
        <div class="stat-block">
          <span class="stat-label" id="stat-label-mean"></span>
          <span class="deviation-mean" id="deviation-mean">–</span>
        </div>
        <div class="stat-block">
          <span class="stat-label"><span data-t="daily.deviation"></span> <span id="deviation-period-label"></span></span>
          <span class="deviation-value" id="deviation-value">–</span>
        </div>
      </div>
    </div>
    <div class="period-toggle-group">
      <span class="ref-period-label" data-t="common.referencePeriodLabel"></span>
      <div class="period-toggle-row" id="legend-periods"></div>
      <button
        id="period-info-btn"
        class="info-btn small"
        type="button"
        aria-haspopup="dialog"
        aria-expanded="false"
        aria-controls="info-popover"
        data-t-aria="daily.periodInfoAria"
      >i</button>
    </div>
  </div>

  <div class="timeline-wrap">
    <div class="timeline-track-row">
      <span class="timeline-year-bound" id="timeline-year-start">–</span>
      <input type="range" id="year-slider" class="year-slider" min="0" max="0" value="0" step="1" data-t-aria="timeline.sliderAria" />
      <span class="timeline-year-bound" id="timeline-year-end">–</span>
    </div>
    <div class="transport-controls">
      <button id="prev-year-btn" class="step-btn" data-t-aria="timeline.prevAria">&#9664;</button>
      <button id="play-btn" class="play-btn" data-t-aria="timeline.playAria">&#9654;</button>
      <button id="next-year-btn" class="step-btn" data-t-aria="timeline.nextAria">&#9654;</button>
    </div>
  </div>

  <div class="colorbar-row" id="colorbar-row" aria-hidden="true">
    <span class="legend-label" id="legend-label-cold"></span>
    <svg id="legend-gradient" width="180" height="10"></svg>
    <span class="legend-label" id="legend-label-warm"></span>
    <span class="colorbar-vs">
      <span data-t="daily.legendVs"></span> <span class="line-swatch" aria-hidden="true"></span>
      <span data-t="daily.legendReference"></span> <span id="colorbar-period-label"></span>
    </span>
  </div>

  <div class="bar-legend-row" id="bar-legend-row" aria-hidden="true" style="display: none;">
    <span class="bar-legend-item">
      <span class="swatch-box" id="bar-legend-year-swatch"></span>
      <span id="bar-legend-year-label"></span>
    </span>
    <span class="bar-legend-item">
      <span class="swatch-box" id="bar-legend-period-swatch"></span>
      <span id="bar-legend-period-label"></span>
    </span>
  </div>

  <div class="chart-wrap">
    <svg id="chart" role="img"></svg>
    <svg id="chart-bar" role="img" style="display: none;"></svg>
    <div id="tooltip" class="tooltip" hidden></div>
  </div>
  <button type="button" class="hint-btn" id="hint-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="info-popover" data-t="daily.hintButton"></button>

  <section class="compare" id="compare">
    <h2 id="compare-title" data-t="daily.compareTitleDefault"></h2>
    <p class="compare-headline" id="compare-headline"></p>
    <div class="compare-legend" id="compare-legend"></div>
    <svg class="compare-chart" id="compare-chart" viewBox="0 0 800 320" preserveAspectRatio="xMidYMid meet"></svg>
  </section>

  <div class="methodology-links">
    <button type="button" class="methodology-link-btn" id="methodology-calc-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="info-popover" data-t="daily.methodologyCalcButton"></button>
    <button type="button" class="methodology-link-btn" id="methodology-climate-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="info-popover" data-t="daily.methodologyClimateButton"></button>
  </div>
</main>

<footer class="app-footer">
  <p data-t="footer.data"></p>
  <p class="footer-scape" data-t="footer.credit"></p>
</footer>

<script src="theme/theme.js"></script>
<script src="content/texts.de.js"></script>
<script src="js/texts.js"></script>
<script src="js/vendor/d3.v7.min.js"></script>
<script src="js/variable-config.js"></script>
<script src="js/spaghetti-plot.js"></script>
<script src="js/monthly-bar-plot.js"></script>
<script src="js/main.js"></script>
</body>
</html>
