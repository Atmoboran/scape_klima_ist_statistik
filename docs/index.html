<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-t="page.pageTitle">Klima ist Statistik</title>
<meta name="description" content="">
<!-- Structure only. Design: theme/ · texts: content/texts.de.js · layout: css/ · behaviour: js/ -->
<script src="js/view.js" data-app="klimastatistik"></script>
<link rel="stylesheet" href="theme/theme.css">
<link rel="stylesheet" href="css/kit.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="top">
  <a class="logo" href="index.html" data-brand="logo"></a>
  <div class="top-right">
    <!-- the three views of the page; js/main.js switches them (#verlauf, #haeufigkeit, #trend) -->
    <nav class="nav" data-t-aria="views.ariaLabel">
      <a href="#verlauf" data-view="verlauf"><span class="num">1</span><span data-t="views.verlauf.nav"></span></a>
      <a href="#haeufigkeit" data-view="haeufigkeit"><span class="num">2</span><span data-t="views.haeufigkeit.nav"></span></a>
      <a href="#trend" data-view="trend"><span class="num">3</span><span data-t="views.trend.nav"></span></a>
    </nav>
    <button type="button" class="view-toggle"></button>
  </div>
</header>

<div class="poster small">
  <div class="f f1"></div><div class="f f2"></div><div class="f f3"></div>
  <svg class="l2" viewBox="0 0 120 120" aria-hidden="true">
    <rect x="6" y="70" width="18" height="44" fill="currentColor"/><rect x="30" y="56" width="18" height="58" fill="currentColor"/>
    <rect x="54" y="62" width="18" height="52" fill="currentColor"/><rect x="78" y="34" width="18" height="80" fill="currentColor"/>
    <rect x="102" y="12" width="18" height="102" fill="currentColor"/>
  </svg>
  <svg class="l3" viewBox="0 0 400 400" aria-hidden="true">
    <path d="M0,330 C110,330 120,120 200,120 C280,120 290,330 400,330"/>
    <path d="M0,300 C110,300 120,80 200,80 C280,80 290,300 400,300"/>
  </svg>
  <div class="poster-text">
    <p class="kicker" data-t="page.kicker"></p>
    <h1 class="headline" data-t-html="page.headline"></h1>
    <p class="lead" data-t="page.lead"></p>
  </div>
</div>

<main class="page">
  <div class="lab">
    <div class="lab-pre">
      <div class="pickers">
        <div class="pick">
          <div class="pick-head">
            <label for="variable-select" class="section-label" data-t="pickers.variable"></label>
            <button type="button" class="info" aria-controls="variable-note" data-t-aria="pickers.variableInfoAria"></button>
          </div>
          <select id="variable-select" class="select">
            <option value="temperature" data-t="variables.temperature.label"></option>
            <option value="precipitation" data-t="variables.precipitation.label"></option>
            <option value="sunshine" data-t="variables.sunshine.label"></option>
          </select>
        </div>
        <div class="pick">
          <div class="pick-head">
            <label for="station-select" class="section-label" data-t="pickers.station"></label>
            <button type="button" class="info" aria-controls="station-note" data-t-aria="pickers.stationInfoAria"></button>
          </div>
          <select id="station-select" class="select"></select>
        </div>
        <div class="pick">
          <div class="pick-head">
            <label for="period-select" class="section-label" data-t="common.referencePeriodShort"></label>
            <button type="button" class="info" aria-controls="period-note" data-t-aria="common.periodInfoAria"></button>
          </div>
          <select id="period-select" class="select"></select>
        </div>
      </div>
      <div class="info-note" id="variable-note" hidden></div>
      <div class="info-note" id="station-note" hidden></div>
      <div class="info-note" id="period-note" hidden data-t-html="common.periodInfo"></div>

      <div class="seg-row">
        <div class="seg" id="season-toggle" role="group" data-t-aria="page.seasonAria"></div>
      </div>

      <div class="readout-grid" aria-live="polite">
        <div><span data-t="page.year"></span><b id="readout-year">–</b></div>
        <div><span id="readout-value-label"></span><b id="readout-value">–</b></div>
        <div><span data-t="page.deviation"></span><b id="readout-deviation">–</b></div>
      </div>
    </div>

    <div class="lab-stage">
      <p class="view-question" id="view-question"></p>
      <div class="stage-frame chart-frame" id="stage-frame">
        <!-- 1 Verlauf: one line per year (or monthly bars for sunshine) -->
        <div class="chart-pane" data-pane="verlauf">
          <div class="chart-legend" id="verlauf-legend" aria-hidden="true">
            <span class="legend-scale">
              <span class="legend-label legend-cold"></span>
              <span class="legend-gradient"></span>
              <span class="legend-label legend-warm"></span>
            </span>
            <span class="legend-vs"><span class="line-swatch"></span> <span data-t="legends.reference"></span> <span class="legend-period"></span></span>
          </div>
          <div class="chart-legend" id="bar-legend" aria-hidden="true" hidden>
            <span class="legend-item"><span class="swatch-box" id="bar-legend-year-swatch"></span><span data-t="legends.barYear"></span></span>
            <span class="legend-item"><span class="swatch-box" id="bar-legend-period-swatch"></span><span id="bar-legend-period-label"></span></span>
          </div>
          <svg id="chart" class="chart" role="img"></svg>
          <svg id="chart-bar" class="chart" role="img" hidden></svg>
        </div>
        <!-- 2 Häufigkeit: distribution of the days of one year against the reference period -->
        <div class="chart-pane" data-pane="haeufigkeit" hidden>
          <div class="chart-legend" aria-hidden="true">
            <span class="legend-item"><span class="line-swatch"></span> <span data-t="legends.distYear"></span></span>
            <span class="legend-item"><span class="line-swatch dashed"></span> <span class="legend-dist-period"></span></span>
          </div>
          <svg id="distribution-chart" class="chart" role="img"></svg>
        </div>
        <!-- 3 Trend: one bar per year, 10-year moving average -->
        <div class="chart-pane" data-pane="trend" hidden>
          <div class="chart-legend" aria-hidden="true">
            <span class="legend-scale">
              <span class="legend-label legend-cold"></span>
              <span class="legend-gradient"></span>
              <span class="legend-label legend-warm"></span>
            </span>
            <span class="legend-vs"><span class="line-swatch"></span> <span data-t="legends.movingAverage"></span></span>
          </div>
          <svg id="trend-chart" class="chart" role="img"></svg>
        </div>
        <div id="tooltip" class="tooltip" hidden></div>
        <p class="load-error" id="load-error" hidden data-t="loadError"></p>
      </div>
      <div class="timeline">
        <span class="transport">
          <button type="button" class="tool" id="prev-year-btn" data-t-aria="timeline.prevAria"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h2.6v14H5zM19 5l-10 7 10 7z"/></svg></button>
          <button type="button" class="tool play pulse" id="play-btn" data-t-aria="timeline.playAria">
            <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8V4z"/></svg>
            <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12"/></svg>
          </button>
          <button type="button" class="tool" id="next-year-btn" data-t-aria="timeline.nextAria"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.4 5H19v14h-2.6zM5 5l10 7-10 7z"/></svg></button>
        </span>
        <span class="year-bound" id="timeline-year-start">–</span>
        <input type="range" id="year-slider" class="year-slider" min="0" max="0" value="0" step="1" data-t-aria="timeline.sliderAria">
        <span class="year-bound" id="timeline-year-end">–</span>
      </div>
    </div>

    <div class="lab-post">
      <button type="button" class="btn tasks-open" id="tasks-open" aria-haspopup="dialog" aria-controls="tasks-dialog">
        <span data-t="quiz.open"></span> <span class="quiz-progress" id="quiz-progress"></span>
      </button>
    </div>
  </div>

  <dialog class="quiz-dialog" id="tasks-dialog" aria-labelledby="tasks-title">
    <div class="quiz-head">
      <h2 id="tasks-title" data-t="quiz.title"></h2>
      <button type="button" class="quiz-close" id="tasks-close" data-t-aria="quiz.closeAria">&times;</button>
    </div>
    <p class="quiz-intro" data-t="quiz.intro"></p>
    <ol class="quiz" id="quiz"></ol>
  </dialog>

  <div class="topics">
    <details class="topic"><summary data-t="common.topics.chartTitle"></summary><div class="topic-body" id="topic-chart"></div></details>
    <details class="topic"><summary data-t="common.topics.calcTitle"></summary><div class="topic-body" id="topic-calc"></div></details>
    <details class="topic" id="topic-climate-details">
      <summary data-t="common.topics.climateTitle"></summary>
      <div class="topic-body" id="topic-climate"></div>
      <section class="compare" id="compare">
        <h3 class="compare-title" id="compare-title" data-t="compare.titleDefault"></h3>
        <p class="compare-headline" id="compare-headline"></p>
        <div class="compare-legend" id="compare-legend"></div>
        <svg class="compare-chart" id="compare-chart" role="img" data-t-aria="compare.aria"></svg>
      </section>
    </details>
  </div>
</main>

<footer class="foot">
  <p class="sources" data-t="sources"></p>
  <p class="brand-line" data-brand="line"></p>
</footer>

<script src="theme/theme.js"></script>
<script src="content/texts.de.js"></script>
<script src="js/texts.js"></script>
<script src="js/brand.js"></script>
<script src="js/kit.js"></script>
<script src="js/vendor/d3.v7.min.js"></script>
<script src="js/shared.js"></script>
<script src="js/variable-config.js"></script>
<script src="js/spaghetti-plot.js"></script>
<script src="js/monthly-bar-plot.js"></script>
<script src="js/distribution-plot.js"></script>
<script src="js/annual-trend-plot.js"></script>
<script src="js/main.js"></script>
</body>
</html>
